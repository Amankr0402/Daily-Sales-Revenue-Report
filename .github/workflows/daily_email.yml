name: Automated Daily Sales Report Email

on:
  schedule:
    # 10:00 AM IST = 04:30 AM UTC
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer system dependencies
        # libasound2 was renamed libasound2t64 in Ubuntu 24.04; fall back for older runners
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxss1 libgbm1 libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libatk1.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Send Daily Sales Report Email
        # send_report_now.js syncs data from Google Sheets & Metabase then sends the email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          METABASE_CSV_URL: ${{ secrets.METABASE_CSV_URL }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
        run: node scripts/build_full_report.js