name: Automated Sales Data Sync

on:
  # Run automatically every 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main or master
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/sync_sheets.js'
      - '.github/workflows/sync_data.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fetch and Sync Latest Data (Google Sheets + Metabase)
        run: node scripts/sync_sheets.js

      - name: Build Daily Report HTML
        run: node scripts/build_report.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Amankr0402"
          git config --global user.email "amankumar.ak0402@gmail.com"
          git add data/data.json \
                  data/secondary_sales_sheet.csv \
                  data/refunds.csv \
                  data/delivery_fees.csv \
                  data/app_downloads_details.csv \
                  data/telecrm_leads_details.csv \
                  data/new_users_delivery_status_details.csv \
                  data/all_new_users_order_status_details.csv \
                  data/subs_ending_5d_details.csv \
                  data/subs_expired_7d_details.csv \
                  data/subs_expiring_today_details.csv \
                  data/active_sub_no_orders_details.csv \
                  data/plan_exp_no_order_details.csv \
                  data/plan_expiring_no_order_details.csv \
                  public/daily-report.html
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "chore(data): auto-sync sales data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Trigger Vercel Redeploy
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel deployment..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            --fail \
            && echo "✅ Vercel deploy triggered successfully." \
            || echo "⚠️ Vercel deploy hook failed (non-fatal)."
