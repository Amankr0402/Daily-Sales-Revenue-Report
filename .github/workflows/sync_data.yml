name: Automated Sales Data Sync

on:
  # Run automatically every 15 minutes
  schedule:
    - cron: '*/15 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main or master
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/sync_sheets.js'
      - '.github/workflows/sync_data.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fetch and Sync Latest Google Sheets Data
        run: node scripts/sync_sheets.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "No new sales data changes to commit."
          else
            git commit -m "chore(data): auto-sync latest sales records from Google Sheets"
            git push
          fi
